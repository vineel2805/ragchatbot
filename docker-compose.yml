services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: devdocs-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    image: vineelkolli/devdocs-backend:latest
    container_name: devdocs-backend
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: devdocs_chunks
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-3-27b-it:free}
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    image: vineelkolli/devdocs-frontend:latest
    container_name: devdocs-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped